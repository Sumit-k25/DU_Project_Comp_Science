<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teaching Details</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #f5f7fb;
        color: #1f2937;
      }
      .container {
        max-width: 1000px;
        margin: 40px auto;
        padding: 24px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }
      button {
        background: #2563eb;
        color: white;
        border: none;
        padding: 10px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
      }
      button:hover { background: #1d4ed8; }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th, td {
        padding: 12px;
        border-bottom: 1px solid #e5e7eb;
        text-align: left;
      }
      th { background: #f8fafc; }
      .form-card {
        margin-top: 20px;
        padding: 16px;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        display: none;
      }
      .form-card input, .form-card select {
        width: 100%;
        margin-bottom: 10px;
        padding: 10px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
      }
      .actions { display: flex; gap: 10px; }
      .message { margin-top: 12px; font-weight: bold; }
      .teacher-link { color: #2563eb; cursor: pointer; text-decoration: underline; }
      .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); justify-content: center; align-items: center; z-index: 1000; }
      .modal-content { background: white; width: min(700px, 90vw); max-height: 80vh; overflow: auto; padding: 20px; border-radius: 12px; }
      .modal-close { float: right; cursor: pointer; font-size: 18px; }
      .detail-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
      .detail-table th, .detail-table td { border: 1px solid #e5e7eb; padding: 8px; text-align: left; }
    </style>
  </head>
  <body>
    <div class="modal" id="teacherModal">
      <div class="modal-content">
        <span class="modal-close" id="modalClose">×</span>
        <h3 id="modalTitle">Teacher Details</h3>
        <div id="modalBody"></div>
      </div>
    </div>

    <div class="container">
      <div class="header">
        <h2>College Course Teaching Details</h2>
        <div style="display:flex; gap:10px; align-items:center;">
          <span id="userLabel" style="font-weight:bold;"></span>
          <button id="addBtn">＋ Add Record</button>
        </div>
      </div>

      <div id="message" class="message"></div>

      <div id="formCard" class="form-card">
        <h3>Add New Record</h3>
        <select id="collegeSelect">
          <option value="">Select College</option>
        </select>
        <select id="programSelect">
          <option value="">Select Program</option>
        </select>
        <select id="paperSelect">
          <option value="">Select Paper</option>
        </select>
        <input id="semester" placeholder="Semester" readonly />
        <select id="teacherSelect">
          <option value="">Select Teacher</option>
        </select>
        <input id="upcCode" placeholder="UPC Code" readonly />
        <select id="theoryPractical">
          <option value="">Select Type</option>
          <option value="Theory">Theory</option>
          <option value="Practical">Practical</option>
          <option value="Theory and Practical">Theory and Practical</option>
        </select>
        <input id="academicYear" placeholder="Academic Year" readonly />
        <div class="actions">
          <button id="saveBtn">Save</button>
          <button id="cancelBtn" style="background:#64748b;">Cancel</button>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>S.No.</th>
            <th>Program Name</th>
            <th>Semester</th>
            <th>UPC Code - Paper Name</th>
            <th>Teacher Name</th>
            <th>Theory/Practical</th>
            <th>Academic Year</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <script>
      const teachingTable = 'College_Course_Teaching_Details';

      const rowsBody = document.getElementById('rows');
      const formCard = document.getElementById('formCard');
      const message = document.getElementById('message');
      const teacherModal = document.getElementById('teacherModal');
      const modalBody = document.getElementById('modalBody');
      const modalTitle = document.getElementById('modalTitle');
      const modalClose = document.getElementById('modalClose');
      const collegeSelect = document.getElementById('collegeSelect');
      const programSelect = document.getElementById('programSelect');
      const paperSelect = document.getElementById('paperSelect');
      const teacherSelect = document.getElementById('teacherSelect');
      const userLabel = document.getElementById('userLabel');
      const semesterInput = document.getElementById('semester');
      const upcCodeInput = document.getElementById('upcCode');
      const theoryPracticalSelect = document.getElementById('theoryPractical');
      const academicYearInput = document.getElementById('academicYear');

      const currentUser = sessionStorage.getItem('ticEmail');
      const collegeName = sessionStorage.getItem('collegeName') || '';
      const academicYear = sessionStorage.getItem('academicYear') || '';
      const teacherName = sessionStorage.getItem('userName') || currentUser || '';

      if (!currentUser) {
        window.location.href = 'auth_demo.html';
      } else {
        userLabel.textContent = `${teacherName} • ${collegeName}${academicYear ? ' • ' + academicYear : ''}`;
      }

      let collegeMap = new Map();

      function openTeacherModal(teacherId, teacherName, academicYearValue) {
        modalTitle.textContent = teacherName || 'Teacher Details';
        modalBody.innerHTML = '<p>Loading...</p>';
        teacherModal.style.display = 'flex';

        const query = new URLSearchParams();
        if (teacherId) query.set('teacherId', teacherId);
        if (academicYearValue) query.set('academicYear', academicYearValue);

        fetch(`/api/teacher-details?${query.toString()}`)
          .then((response) => response.json())
          .then((result) => {
            if (!result.success) {
              modalBody.innerHTML = `<p>${result.message || 'Unable to load details.'}</p>`;
              return;
            }

            const teacher = result.teacher || {};
            const courses = result.courses || [];
            modalBody.innerHTML = `
              <p><strong>Name:</strong> ${teacher.Teacher_Name || ''}</p>
              <p><strong>Email:</strong> ${teacher.Mail || ''}</p>
              <p><strong>Status:</strong> ${teacher.Status || ''}</p>
              <p><strong>Academic Year:</strong> ${academicYearValue || ''}</p>
              <table class="detail-table">
                <thead>
                  <tr>
                    <th>S.No.</th>
                    <th>Program</th>
                    <th>UPC Code</th>
                    <th>Paper Name</th>
                    <th>Type</th>
                    <th>Semester</th>
                  </tr>
                </thead>
                <tbody>
                  ${courses.length ? courses.map((course, index) => `
                    <tr>
                      <td>${index + 1}</td>
                      <td>${course.Program_Name || ''}</td>
                      <td>${course.UPC_Code || ''}</td>
                      <td>${course.Paper_Name || ''}</td>
                      <td>${course.Theory_Practical || ''}</td>
                      <td>${course.Semester || ''}</td>
                    </tr>
                  `).join('') : '<tr><td colspan="6">No courses found.</td></tr>'}
                </tbody>
              </table>
            `;
          })
          .catch(() => {
            modalBody.innerHTML = '<p>Unable to load teacher details.</p>';
          });
      }

      modalClose.addEventListener('click', () => {
        teacherModal.style.display = 'none';
      });

      teacherModal.addEventListener('click', (event) => {
        if (event.target === teacherModal) {
          teacherModal.style.display = 'none';
        }
      });

      async function loadColleges() {
        try {
          const response = await fetch('/api/colleges');
          const result = await response.json();
          const data = result.data || [];

          collegeMap = new Map();
          collegeSelect.innerHTML = '<option value="">Select College</option>';

          (data || []).forEach((college) => {
            collegeMap.set(college.Cid, college.College_Name || 'Unknown College');
            const option = document.createElement('option');
            option.value = college.Cid;
            option.textContent = college.College_Name || `College ${college.Cid}`;
            collegeSelect.appendChild(option);
          });

          const storedCollegeId = sessionStorage.getItem('collegeId');
          if (storedCollegeId) {
            collegeSelect.value = storedCollegeId;
            collegeSelect.disabled = true;
            await populateProgramSelect(storedCollegeId);
            await populateTeacherSelect(storedCollegeId);
          }
        } catch (error) {
          console.warn('Could not load colleges:', error);
        }
      }

      async function loadPrograms(collegeId) {
        if (!collegeId) {
          return [];
        }

        try {
          const response = await fetch(`/api/programs?collegeId=${encodeURIComponent(collegeId)}`);
          const result = await response.json();
          return result.data || [];
        } catch (error) {
          console.warn('Could not load programs:', error);
          return [];
        }
      }

      async function loadTeachers(collegeId) {
        if (!collegeId) {
          return [];
        }

        try {
          const response = await fetch(`/api/teachers?collegeId=${encodeURIComponent(collegeId)}`);
          const result = await response.json();
          return result.data || [];
        } catch (error) {
          console.warn('Could not load teachers:', error);
          return [];
        }
      }

      async function loadPapers(programId, semester) {
        const query = new URLSearchParams();
        if (programId) query.set('programId', programId);
        if (semester) query.set('semester', semester);

        try {
          const response = await fetch(`/api/papers?${query.toString()}`);
          const result = await response.json();
          return result.data || [];
        } catch (error) {
          console.warn('Could not load papers:', error);
          return [];
        }
      }

      async function populateProgramSelect(collegeId) {
        const programs = await loadPrograms(collegeId);
        programSelect.innerHTML = '<option value="">Select Program</option>';
        programs.forEach((program) => {
          const option = document.createElement('option');
          option.value = program.Program_id;
          option.textContent = program.Program_Name || `Program ${program.Program_id}`;
          programSelect.appendChild(option);
        });
      }

      async function populateTeacherSelect(collegeId) {
        const teachers = await loadTeachers(collegeId);
        teacherSelect.innerHTML = '<option value="">Select Teacher</option>';
        teachers.forEach((teacher) => {
          const option = document.createElement('option');
          option.value = teacher.Teacher_Id;
          const teacherName = teacher.Teacher_Name || `Teacher ${teacher.Teacher_Id}`;
          option.textContent = `${teacher.Teacher_Id} - ${teacherName}`;
          teacherSelect.appendChild(option);
        });
      }

      async function populatePaperSelect(programId, semester) {
        const papers = await loadPapers(programId, semester);
        paperSelect.innerHTML = '<option value="">Select Paper</option>';
        papers.forEach((paper) => {
          const option = document.createElement('option');
          option.value = paper.UPC_Code;
          option.textContent = paper.Paper_Name || `Paper ${paper.UPC_Code}`;
          paperSelect.appendChild(option);
        });
      }

      collegeSelect.addEventListener('change', async () => {
        const selectedCollegeId = collegeSelect.value || sessionStorage.getItem('collegeId');
        await populateProgramSelect(selectedCollegeId);
        await populateTeacherSelect(selectedCollegeId);
        paperSelect.innerHTML = '<option value="">Select Paper</option>';
        semesterInput.value = '';
        upcCodeInput.value = '';
      });

      async function loadData() {
        await loadColleges();

        try {
          const response = await fetch(`/api/records?ticEmail=${encodeURIComponent(currentUser || '')}&collegeId=${encodeURIComponent(sessionStorage.getItem('collegeId') || '')}`);
          const result = await response.json();
          const data = result.data || [];

          rowsBody.innerHTML = '';
          if (!data || data.length === 0) {
            rowsBody.innerHTML = '<tr><td colspan="8">No records found.</td></tr>';
            return;
          }

          data.forEach((row, index) => {
            const tr = document.createElement('tr');
            const teacherName = row.Teacher_Name || row.Teacher_id || '';
            const teacherId = row.Teacher_id;
            const academicYearValue = row.Academic_Year;
            tr.innerHTML = `
              <td>${index + 1}</td>
              <td>${row.Program_Name || row.Program_Id || ''}</td>
              <td>${row.Semester ?? ''}</td>
              <td>${row.UPC_Code != null ? `${row.UPC_Code}${row.Paper_Name ? ' - ' + row.Paper_Name : ''}` : ''}</td>
              <td>
                ${teacherId != null ? `<span class="teacher-link" data-teacher-id="${teacherId}" data-teacher-name="${teacherName}" data-academic-year="${academicYearValue ?? ''}">${teacherName}</span>` : ''}
              </td>
              <td>${row.Theory_Practical ?? ''}</td>
              <td>${academicYearValue ?? ''}</td>
            `;
            rowsBody.appendChild(tr);
          });

          rowsBody.querySelectorAll('.teacher-link').forEach((link) => {
            link.addEventListener('click', () => {
              openTeacherModal(link.dataset.teacherId, link.dataset.teacherName, link.dataset.academicYear);
            });
          });
        } catch (error) {
          message.textContent = `Error loading data from ${teachingTable}: ${error.message}`;
        }
      }

      document.getElementById('addBtn').addEventListener('click', () => {
        academicYearInput.value = academicYear || '';
        formCard.style.display = 'block';
      });

      document.getElementById('cancelBtn').addEventListener('click', () => {
        formCard.style.display = 'none';
      });

      programSelect.addEventListener('change', async () => {
        await populatePaperSelect(null);
        semesterInput.value = '';
        upcCodeInput.value = '';
      });

      paperSelect.addEventListener('change', async () => {
        const selectedUPC = paperSelect.value;
        const papers = await loadPapers(null);
        const selectedPaper = papers.find((paper) => String(paper.UPC_Code) === String(selectedUPC));
        if (selectedPaper) {
          semesterInput.value = selectedPaper.Semester || '';
          upcCodeInput.value = selectedPaper.UPC_Code || '';
        } else {
          semesterInput.value = '';
          upcCodeInput.value = '';
        }
      });

      document.getElementById('saveBtn').addEventListener('click', async () => {
        const payload = {
          Cid: Number(sessionStorage.getItem('collegeId')) || Number(collegeSelect.value) || null,
          Program_Id: Number(programSelect.value) || null,
          Semester: Number(semesterInput.value) || null,
          UPC_Code: Number(upcCodeInput.value) || null,
          Teacher_id: Number(teacherSelect.value) || null,
          Theory_Practical: document.getElementById('theoryPractical').value || null,
          Academic_Year: Number(document.getElementById('academicYear').value) || null,
        };

        try {
          const response = await fetch('/api/records', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const result = await response.json();

          if (!response.ok) {
            throw new Error(result.message || 'Insert failed');
          }

          message.textContent = 'Record added successfully.';
          formCard.style.display = 'none';
          formCard.querySelectorAll('input').forEach((f) => {
            if (f.id !== 'academicYear') f.value = '';
          });
          formCard.querySelectorAll('select').forEach((f) => {
            if (f !== collegeSelect) f.value = '';
          });
          academicYearInput.value = academicYear || '';
          if (!collegeSelect.disabled) collegeSelect.value = '';
          await loadData();
        } catch (error) {
          message.textContent = `Error inserting record into ${teachingTable}: ${error.message}`;
        }
      });

      loadData();
    </script>
  </body>
</html>
